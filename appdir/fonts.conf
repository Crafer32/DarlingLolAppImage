<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- darling-lol: system fonts minus Type 1 (X11 core) fonts, which crash the
     League client's CEF renderer under Darling ("Preparing browse" forever). -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- baseline text fonts shipped with the AppImage, for systems (or sandboxes) where fontconfig
       only sees icon fonts: upstream issue #106, blank captcha and login labels -->
  <dir prefix="relative">fonts</dir>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/X11/Type1/*</glob>
      <glob>/usr/share/fonts/Type1/*</glob>
      <glob>*.pfb</glob>
      <glob>*.pfa</glob>
      <pattern><patelt name="fontformat"><string>Type 1</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
